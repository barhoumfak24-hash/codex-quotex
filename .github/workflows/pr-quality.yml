name: PR Quality Gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-quality:
    name: App quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: |
          corepack prepare pnpm@11.0.7 --activate
          pnpm install --frozen-lockfile

      - name: Type and lint check
        run: pnpm run lint

      - name: Unit tests
        run: pnpm run test

      - name: Production build
        run: pnpm run build

      - name: Dependency security audit
        run: pnpm run security:audit

  server-quality:
    name: Server quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install server dependencies
        run: |
          corepack prepare pnpm@11.0.7 --activate
          pnpm install --frozen-lockfile

      - name: Server TypeScript build
        run: pnpm -C server run build

      - name: Server dependency security audit
        run: pnpm -C server audit --audit-level=high
